name: Build MSI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install WiX
      run: |
        dotnet tool install --global wix --version 5.0.1

    - name: Build MSI
      run: |
        wix build stree.wxs -o stree-windows.msi
